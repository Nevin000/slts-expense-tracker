# =========================================
# Application
# =========================================
spring.application.name=expense-tracker-backend

# =========================================
# Server
# =========================================
server.port=8080

# =========================================
# MySQL Database
# =========================================
spring.datasource.url=jdbc:mysql://localhost:3306/expense_tracker?useSSL=false&serverTimezone=Asia/Colombo&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================
# JPA / Hibernate
# =========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================================
# Database initialization
# =========================================
spring.sql.init.mode=never

# JWT Configuration
app.jwt.secret=${JWT_SECRET:change-this-secret}
app.jwt.expiration=${JWT_EXPIRATION:86400000}