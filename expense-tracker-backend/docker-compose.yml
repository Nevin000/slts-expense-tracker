services:
  mysql:
    image: mysql:8.0
    container_name: expense-tracker-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: expense_tracker
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: expense_user
      MYSQL_PASSWORD: expense_password

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-prootpassword"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: expense-tracker-backend
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "18080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/expense_tracker?useSSL=false&serverTimezone=Asia/Colombo&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: expense_user
      SPRING_DATASOURCE_PASSWORD: expense_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      APP_JWT_SECRET: VGhpc0lzQVNlY3VyZVN1ZmZpY2llbnRseUxvbmdTZWNyZXRLZXlGb3JFbnRyeQ==
      APP_JWT_EXPIRATION: 86400000

volumes:
  mysql_data: